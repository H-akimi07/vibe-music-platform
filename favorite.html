<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Your favorite songs on VIBE.">

    <title>VIBE — Favorites</title>


    <!-- ==============================
     BOOTSTRAP 5
=============================== -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- ==============================
     BOOTSTRAP ICONS
=============================== -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- ==============================
     GOOGLE FONTS
=============================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">


    <!-- ==============================
     GLOBAL CSS
     Shared with entire team
=============================== -->

    <link rel="stylesheet" href="css/explore.css">
    <link rel="stylesheet" href="css/colors.css">

    <!-- ==============================
     FAVORITES PAGE CSS
=============================== -->

    <link rel="stylesheet" href="css/favorite.css">
</head>

<body>

    <!-- ==================================================
     MAIN CONTENT
=================================================== -->

    <main>


        <!-- ==================================================
         HERO
    =================================================== -->

        <section class="explore-hero favorite-hero">

            <!-- Decorative glow -->

            <div class="explore-glow explore-glow-primary"></div>

            <div class="explore-glow explore-glow-secondary"></div>


            <div class="container">

                <div class="row align-items-center g-5">


                    <!-- HERO TEXT -->

                    <div class="col-lg-8">

                        <div class="explore-eyebrow">

                            <span class="explore-pulse"></span>

                            YOUR COLLECTION

                        </div>


                        <h1 class="explore-title">

                            Songs you

                            <span>love.</span>

                        </h1>


                        <p class="explore-subtitle">

                            Every track you've hearted,
                            all in one place — ready
                            whenever the mood strikes.

                        </p>


                        <!-- STATS -->

                        <div class="favorite-stats">

                            <div class="favorite-stat">

                                <span id="favCountStat" class="favorite-stat-value">0</span>

                                <span class="favorite-stat-label">Favorites</span>

                            </div>

                            <div class="favorite-stat-divider"></div>

                            <div class="favorite-stat">

                                <span id="favDurationStat" class="favorite-stat-value">0:00</span>

                                <span class="favorite-stat-label">Total time</span>

                            </div>

                            <div class="favorite-stat-divider"></div>

                            <div class="favorite-stat">

                                <span id="favGenreStat" class="favorite-stat-value">0</span>

                                <span class="favorite-stat-label">Genres</span>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

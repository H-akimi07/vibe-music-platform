<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="CSS/Artist.css">
</head>

<body>

<!-- Hero section part ... -->

<!-- ARTIST HERO SECTION -->
<section class="artist-hero position-relative d-flex align-items-center py-5">
  <!-- تصویر پس‌زمینه بزرگ که مات (Blur) می‌شود -->
  <div class="hero-bg-blur" id="hero-blur-img"></div>
  
  <div class="container position-relative z-1">
    <div class="row align-items-center">
      <!-- بخش متن‌ها و دکمه‌ها -->
      <div class="col-lg-7 text-white text-center text-lg-start">
        <div class="d-flex align-items-center justify-content-center justify-content-lg-start mb-2">
          <span class="badge bg-primary d-flex align-items-center gap-1 py-1.5 px-3 rounded-pill text-xs">
            <svg width="12" height="12" fill="currentColor" viewBox="0 0 16 16"><path d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425z"/></svg>
            Verified Artist
          </span>
        </div>
        
        <h1 class="display-3 fw-bold mb-2 tracking-tight" id="artist-name">Loading...</h1>
        <p class="text-secondary fw-semibold mb-4" id="artist-role">...</p>
        <p class="lead mb-4 max-w-2xl opacity-80" id="artist-bio">...</p>
        
        <!-- آمار خواننده -->
        <div class="d-flex gap-4 justify-content-center justify-content-lg-start mb-4 pb-2">
          <div>
            <div class="fs-4 fw-bold" id="artist-listeners">0</div>
            <div class="small text-muted text-uppercase tracking-wider">Monthly Listeners</div>
          </div>
          <div class="border-start border-secondary opacity-25"></div>
          <div>
            <div class="fs-4 fw-bold" id="artist-streams">0</div>
            <div class="small text-muted text-uppercase tracking-wider">Streams</div>
          </div>
          <div class="border-start border-secondary opacity-25"></div>
          <div>
            <div class="fs-4 fw-bold" id="artist-songs-count">0</div>
            <div class="small text-muted text-uppercase tracking-wider">Songs</div>
          </div>
        </div>
        
        <!-- دکمه‌های اکشن -->
        <div class="d-flex flex-wrap gap-3 justify-content-center justify-content-lg-start">
          <button class="btn btn-play d-flex align-items-center gap-2 px-4 py-2.5 fw-bold rounded-pill text-white" id="btn-play">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/></svg>
            Play
          </button>
          <button class="btn btn-outline-light d-flex align-items-center gap-2 px-4 py-2.5 fw-bold rounded-pill" id="btn-follow">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.838-3.362.314-4.385C13.486.878 10.4.28 8 2.748zM8 15C-7.333 4.868 3.279-3.04 7.824 1.143q.09.083.176.171a3 3 0 0 1 .176-.17C12.72-3.042 23.333 4.867 8 15z"/></svg>
            <span id="follow-text">Follow</span>
          </button>
        </div>
      </div>
      
      <!-- تصویر دایره‌ای خواننده در سمت راست (در حالت دسکتاپ) -->
      <div class="col-lg-5 d-none d-lg-block text-center position-relative">
        <div class="hero-avatar-wrapper mx-auto">
          <img src="" alt="" class="img-fluid rounded-circle shadow-lg object-fit-cover" id="hero-main-img">
        </div>
      </div>
    </div>
  </div>
</section>



















    <script src="JS/Artist.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

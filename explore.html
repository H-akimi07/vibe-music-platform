<!-- ==================================================
     MAIN CONTENT
=================================================== -->

<main>


    <!-- ==================================================
         HERO
    =================================================== -->

    <section class="explore-hero">

        <!-- Decorative glow -->

        <div
            class="explore-glow explore-glow-primary"
        ></div>

        <div
            class="explore-glow explore-glow-secondary"
        ></div>


        <div class="container">

            <div class="row align-items-center g-5">


                <!-- HERO TEXT -->

                <div class="col-lg-7">

                    <div class="explore-eyebrow">

                        <span class="explore-pulse"></span>

                        DISCOVER SOMETHING NEW

                    </div>


                    <h1 class="explore-title">

                        Find your next

                        <span>VIBE.</span>

                    </h1>


                    <p class="explore-subtitle">

                        Explore fresh sounds, discover
                        rising artists and find the music
                        that matches your mood.

                    </p>


                    <!-- SEARCH -->

                    <div class="explore-search">

                        <i
                            class="bi bi-search explore-search-icon"
                        ></i>


                        <input
                            type="search"
                            id="searchInput"
                            class="form-control explore-search-input"
                            placeholder="Search songs, artists or albums..."
                            autocomplete="off"
                        >


                        <span class="explore-search-shortcut">
                            /
                        </span>

                    </div>

                </div>


                <!-- 3D RECORD -->

                <div
                    class="col-lg-5 d-none d-lg-flex justify-content-center"
                >

                    <div class="explore-record">

                        <div class="record-line record-line-one"></div>

                        <div class="record-line record-line-two"></div>

                        <div class="record-line record-line-three"></div>


                        <div class="record-label">

                            <span>V</span>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>



    <!-- ==================================================
         GENRES
    =================================================== -->

    <section class="explore-genres py-5">

        <div class="container">


            <div class="mb-4">

                <span class="explore-section-label">
                    EXPLORE
                </span>

                <h2 class="explore-section-title">
                    Browse by genre
                </h2>

            </div>


            <!-- Bootstrap responsive flex -->

            <div
                id="genreFilters"
                class="d-flex gap-2 flex-nowrap overflow-auto pb-2"
            >

                    data-genre="All"
                >

                    <i class="bi bi-grid me-1"></i>

                    All

                </button>


                <button
